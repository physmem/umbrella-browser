[package]
name = "browser-net"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Without "single-thread" the engine is Send, so lists build off the UI thread.
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
notify = "8.2.2"
regex = "1.13.2"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
