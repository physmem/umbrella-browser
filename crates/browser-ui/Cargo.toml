[package]
name = "browser-ui"
description = "Umbrella's native GPUI chrome."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "umbrella"
path = "src/main.rs"

[dependencies]
browser-core = { path = "../browser-core" }
browser-engine = { path = "../browser-engine" }
browser-net = { path = "../browser-net" }
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui = { package = "gpui-ce", version = "0.3.0", default-features = false, features = ["font-kit", "windows-manifest"] }
gpui_ce_elements = "0.3.0"
gpui_ce_platform = { version = "0.3.0", default-features = false }
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }

[build-dependencies]
embed-resource = "3.0"
